<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
html,body,.stage{width:1080px;height:1920px}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;padding:0 70px}
.big{font-size:104px;font-weight:900;line-height:1.3}
.sb{font-size:46px;color:#c9d4ea;font-weight:600;margin-top:30px;line-height:1.6}
.clock{width:300px;height:300px;margin-bottom:70px}
.feats{display:flex;flex-direction:column;gap:34px;width:100%;margin-top:70px}
.f{display:flex;align-items:center;gap:30px;padding:36px 40px;text-align:right}
.f .ic{flex:none;width:100px;height:100px;border-radius:26px;display:grid;place-items:center;font-size:52px;background:rgba(217,178,95,.15)}
.f span{font-size:50px;font-weight:800}
.trial{margin-top:60px;font-size:64px;font-weight:900;color:var(--navy);padding:26px 60px;border-radius:30px;background:linear-gradient(160deg,var(--gold2),var(--gold) 60%,#b88d3a);box-shadow:0 20px 60px rgba(217,178,95,.4)}
.urlb{margin-top:50px;font-size:72px;color:var(--gold2)}
.glow{position:absolute;width:1200px;height:1200px;left:-60px;top:360px;border-radius:50%;background:radial-gradient(circle,rgba(217,178,95,.2),transparent 60%)}
.bar{position:absolute;top:0;right:0;height:8px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
</style></head><body><div class="stage" id="st"><div class="grid" id="grid"></div><div class="glow" id="glow"></div>
<div class="sc" id="s1">
 <svg class="clock el" id="ck" viewBox="0 0 300 300"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d998"/><stop offset="1" stop-color="#b88d3a"/></linearGradient></defs>
  <circle cx="150" cy="150" r="130" fill="rgba(217,178,95,.08)" stroke="url(#g)" stroke-width="10"/>
  <line id="hh" x1="150" y1="150" x2="150" y2="85" stroke="url(#g)" stroke-width="14" stroke-linecap="round"/>
  <line id="mh" x1="150" y1="150" x2="150" y2="55" stroke="#eef2fa" stroke-width="8" stroke-linecap="round"/>
  <circle cx="150" cy="150" r="12" fill="url(#g)"/></svg>
 <div class="big el" id="q">كام ساعة ضاعت<br>منك الأسبوع ده<br><span class="gold">في الورق؟</span></div>
</div>
<div class="sc" id="s2">
 <div class="big el" id="h2">خلّي <span class="gold">ميزان برو</span><br>يشيل عنك</div>
 <div class="feats">
  <div class="f glass el" id="f1"><div class="ic">🤖</div><span>تلخيص مستندات القضية بالذكاء الاصطناعي</span></div>
  <div class="f glass el" id="f2"><div class="ic">📂</div><span>كل قضية بملفاتها وملخصاتها في مكان واحد</span></div>
  <div class="f glass el" id="f3"><div class="ic">🔒</div><span>بيانات موكلينك في أمان</span></div>
 </div>
</div>
<div class="sc" id="s3">
 <img src="logo.svg" width="230" class="el" id="lg">
 <div class="el" id="nm" style="font-family:Messiri;font-size:110px;font-weight:700;margin-top:30px"><span class="gold">ميزان برو</span></div>
 <div class="trial el" id="tr">جرّب مجانًا 14 يوم</div>
 <div class="urlb url el" id="u">mezan.pro</div>
</div>
<div class="bar" id="bar"></div>
</div>
<script>
const D=12,$=id=>document.getElementById(id),cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-x,3),eb=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const p=(t,a,d)=>cl((t-a)/d);
function set(id,o,y=0,s=1,x=0,ex=''){const e=$(id);e.style.opacity=o;e.style.transform=`translate(${x}px,${y}px) scale(${s}) ${ex}`}
function inOut(t,a,b,f=.4){return Math.min(eo(p(t,a,f)),1-eo(p(t,b-f,f)))}
function rise(id,t,a,d=.6,dist=60){const k=eo(p(t,a,d));set(id,k,(1-k)*dist)}
function seek(t){
 $('grid').style.transform=`translateY(${(t*10)%60}px)`;$('glow').style.transform=`scale(${1+.08*Math.sin(t*1.4)})`;
 $('bar').style.width=(t/D*100)+'%';
 [['s1',0,3.7],['s2',3.5,7.9],['s3',7.7,12.3]].forEach(([id,a,b])=>$(id).style.opacity=inOut(t,a,b));
 {const k=eb(p(t,.1,.7));set('ck',cl(k),0,.5+.5*k);
  $('mh').setAttribute('transform',`rotate(${t*360} 150 150)`);$('hh').setAttribute('transform',`rotate(${t*30} 150 150)`);}
 rise('q',t,.6,.7,70);
 rise('h2',t,3.8,.6,60);
 ['f1','f2','f3'].forEach((id,i)=>{const k=eo(p(t,4.4+i*.45,.6));set(id,k,0,1,(1-k)*-200)});
 {const k=eb(p(t,7.9,.7));set('lg',cl(k),0,.4+.6*k,0,`rotate(${(1-k)*-20}deg)`);}
 rise('nm',t,8.4,.6,60);
 {const k=eb(p(t,8.9,.6));set('tr',cl(k),0,(.7+.3*k)*(1+.025*Math.sin(t*5)*cl(k)));}
 rise('u',t,9.4,.5,40);
 $('st').style.filter=`brightness(${1-.85*eo(p(t,11.6,.4))})`;
}
window.seek=seek;seek(0);
</script></body></html>
