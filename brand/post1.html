<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.top{position:absolute;top:60px;right:70px;left:70px;display:flex;justify-content:space-between;align-items:center}
.pill{font-size:22px;font-weight:700;padding:10px 22px;border-radius:99px;border:1px solid rgba(217,178,95,.5);color:var(--gold2);background:rgba(217,178,95,.08)}
h1{position:absolute;top:170px;right:70px;left:70px;font-size:84px;font-weight:900;line-height:1.25}
.sub{position:absolute;top:395px;right:70px;left:120px;font-size:32px;line-height:1.6;color:#c9d4ea;font-weight:500}
.flow{position:absolute;top:560px;right:70px;left:70px;height:340px;display:flex;align-items:center;justify-content:space-between}
.docs{position:relative;width:260px;height:300px}
.doc{position:absolute;width:210px;height:270px;border-radius:18px;background:#f4f1e8;box-shadow:0 20px 50px rgba(0,0,0,.4);padding:30px 24px}
.doc i{display:block;height:11px;border-radius:6px;background:#c9c3b2;margin-bottom:14px}
.doc i.s{width:60%}.doc i.h{background:#8a7d5c;width:70%;height:15px;margin-bottom:22px}
.d1{right:50px;top:30px;transform:rotate(-8deg);opacity:.7}.d2{right:25px;top:15px;transform:rotate(-3deg);opacity:.85}.d3{right:0;top:0;transform:rotate(3deg)}
.arrow{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px}
.ai{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#f3d998 0%,#d9b25f 55%,#9c7530 100%);box-shadow:0 0 0 14px rgba(217,178,95,.12),0 0 80px rgba(217,178,95,.55);font-size:30px;font-weight:900;color:var(--navy);font-family:CairoL}
.line{width:230px;height:4px;border-radius:4px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.arrow small{font-size:22px;color:var(--gold2);font-weight:700}
.card{width:360px;padding:28px 30px}
.card .t{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:800;margin-bottom:16px}
.card .t b{width:14px;height:14px;border-radius:50%;background:#4ade80;box-shadow:0 0 12px #4ade80}
.card p{font-size:20px;line-height:1.75;color:#cfd8ea;margin-bottom:14px}
.tag{display:inline-block;font-size:18px;font-weight:700;padding:6px 16px;border-radius:10px;background:rgba(217,178,95,.15);color:var(--gold2)}
.foot{position:absolute;bottom:52px;right:70px;left:70px;display:flex;justify-content:space-between;align-items:center;font-size:26px;color:var(--mute)}
.foot .url{font-size:34px;color:var(--gold2)}
</style></head><body><div class="stage"><div class="grid"></div>
<div class="top"><div class="brand"><img src="logo.svg" width="72"><span class="name gold">ميزان برو</span></div><span class="pill">لمكاتب المحاماة</span></div>
<h1>وقتك أغلى<br>من <span class="gold">الورق</span></h1>
<p class="sub">مستندات القضية كلها تتلخّص بالذكاء الاصطناعي…<br>والملخص يتربط بملف القضية تلقائيًا.</p>
<div class="flow">
 <div class="docs"><div class="doc d1"><i class="h"></i><i></i><i></i><i class="s"></i></div><div class="doc d2"><i class="h"></i><i></i><i></i><i class="s"></i></div><div class="doc d3"><i class="h"></i><i></i><i></i><i></i><i class="s"></i><i></i><i class="s"></i></div></div>
 <div class="arrow"><div class="ai">AI</div><div class="line"></div><small>تلخيص ذكي</small></div>
 <div class="card glass"><div class="t"><b></b>ملخص القضية</div><p>أهم الوقائع والطلبات والمستندات في سطور واضحة.</p><span class="tag">مربوط بملف القضية</span></div>
</div>
<div class="foot"><span>نظام إدارة متكامل لمكتبك</span><span class="url">mezan.pro</span></div>
</div></body></html>
