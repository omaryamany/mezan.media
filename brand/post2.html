<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.top{position:absolute;top:60px;right:70px;left:70px;display:flex;justify-content:space-between;align-items:center}
.pill{font-size:22px;font-weight:700;padding:10px 22px;border-radius:99px;border:1px solid rgba(217,178,95,.5);color:var(--gold2);background:rgba(217,178,95,.08)}
.q{position:absolute;top:175px;right:70px;left:70px}
.q small{display:block;font-size:30px;color:var(--gold2);font-weight:700;margin-bottom:6px}
.q h1{font-size:66px;font-weight:900;line-height:1.3}
.opts{position:absolute;top:470px;right:70px;left:70px;display:flex;flex-direction:column;gap:26px}
.opt{display:flex;align-items:center;gap:30px;padding:26px 34px}
.num{flex:none;width:86px;height:86px;border-radius:22px;display:grid;place-items:center;font-family:CairoL;font-size:46px;font-weight:700;color:var(--navy);background:linear-gradient(160deg,var(--gold2),var(--gold) 60%,#b88d3a);box-shadow:0 10px 30px rgba(217,178,95,.35)}
.opt span{font-size:40px;font-weight:700}
.opt em{margin-right:auto;font-style:normal;font-size:44px;opacity:.85}
.foot{position:absolute;bottom:54px;right:70px;left:70px;display:flex;justify-content:space-between;align-items:center}
.cta{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:800}
.cta b{font-size:34px}
.foot .url{font-size:32px;color:var(--gold2)}
</style></head><body><div class="stage"><div class="grid"></div>
<div class="top"><div class="brand"><img src="logo.svg" width="72"><span class="name gold">ميزان برو</span></div><span class="pill">سؤال للزملاء</span></div>
<div class="q"><small>يا متر… بصراحة</small><h1>إيه أكتر حاجة بتاخد<br><span class="gold">وقتك</span> في شغل المكتب؟</h1></div>
<div class="opts">
 <div class="opt glass"><div class="num">1</div><span>متابعة الجلسات والمواعيد</span><em>📅</em></div>
 <div class="opt glass"><div class="num">2</div><span>قراءة وتلخيص المستندات</span><em>📄</em></div>
 <div class="opt glass"><div class="num">3</div><span>تنظيم ملفات الموكلين</span><em>🗂️</em></div>
</div>
<div class="foot"><div class="cta"><b>✍️</b>اكتب رقمك في الكومنتات</div><span class="url">mezan.pro</span></div>
</div></body></html>
